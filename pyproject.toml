[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "session-timer"
version = "0.1.0"
description = "Web-based session timer: admin sets events, display shows a countdown"
readme = "DESIGN.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[project.scripts]
session-timer = "session_timer.main:run"

[tool.setuptools.packages.find]
include = ["session_timer*"]

[tool.setuptools.package-data]
# Ship the static UI assets inside the package (the Docker image and the
# installed console script rely on them being importable).
session_timer = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
