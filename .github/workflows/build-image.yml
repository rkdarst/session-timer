# Build the session-timer image and publish it to ghcr.io.
#
# On pushes, the image is tagged `session-timer:latest` in the runner,
# smoke-tested, and pushed to `ghcr.io/rkdarst/session-timer:latest`
# using the workflow's own GITHUB_TOKEN (packages: write — no registry
# credentials or secrets configured anywhere).
#
# Pull-request runs build and smoke-test but never push.
#
# It builds exactly what the Dockerfile in the pushed commit describes
# (uv.lock-pinned dependencies).

name: build-image

on:
  push:
    branches: [master] # publish runs only from master; other branches
                       # only build via pull_request (never push)
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tests run in a uv-managed environment from the same uv.lock the
      # image uses (dev group brings in pytest + httpx for TestClient).
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"
      - name: Run tests
        run: |
          uv sync --frozen
          uv run pytest -q

      - uses: docker/setup-buildx-action@v3

      - name: Build image (session-timer:latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: session-timer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Smoke test: the container must serve a static asset, mirroring
      # the image HEALTHCHECK (GETs never create a session).
      - name: Smoke test the image
        run: |
          docker run -d --rm --name smoke -p 127.0.0.1:8000:8000 session-timer:latest
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/static/common.js; then
              echo "smoke test ok"
              docker rm -f smoke >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "container did not serve requests:" >&2
          docker logs smoke >&2 || true
          exit 1

      # Publish to ghcr.io, only on push events (PR runs stay local).
      # The built-in GITHUB_TOKEN may push to this repository's own
      # package namespace; the first push creates the package (private
      # by default — flip it to public in the package settings if it
      # should be pullable anonymously).
      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to ghcr.io (ghcr.io/rkdarst/session-timer:latest)
        if: github.event_name == 'push'
        run: |
          docker tag session-timer:latest ghcr.io/rkdarst/session-timer:latest
          docker push ghcr.io/rkdarst/session-timer:latest
