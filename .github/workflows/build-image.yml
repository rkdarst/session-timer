# Build the session-timer image and publish it to ghcr.io as a
# multi-arch image: linux/amd64 plus linux/arm64 (e.g. Raspberry Pi 5
# on 64-bit Raspberry Pi OS).
#
# Job `test` runs pytest (same uv.lock as the image), audits the locked
# dependencies for known CVEs (pip-audit, non-blocking at first — flip
# continue-on-error to false once the noise level is known), builds the
# amd64 image locally and smoke-tests the container — on every push /
# PR / manual dispatch.  Job `publish` (pushes only, after `test`) cross-
# builds amd64 + arm64 under QEMU and pushes the multi-arch manifest to
# `ghcr.io/rkdarst/session-timer:latest` with the workflow's own
# GITHUB_TOKEN (packages: write — no registry credentials or secrets
# configured anywhere).  Layers are cached in the GHA cache: the amd64
# half of the publish build is usually a cache hit, only arm64 is
# built, and it rebuilds fully only when pyproject.toml/uv.lock change
# (all Python deps have aarch64 wheels, so nothing compiles under
# emulation).
#
# Pull-request runs build and smoke-test but never push.
#
# It builds exactly what the Dockerfile in the pushed commit describes
# (uv.lock-pinned dependencies).  The build receives GIT_VERSION
# (git describe --tags --dirty --always: e.g. "0.2.0" on a release
# tag, "0.2.0-3-g943694e" past it, "-dirty" appended for uncommitted
# changes) and GIT_HASH (the full commit sha); both are shown in the
# admin ☰ menu via /api/banner so a deployed instance can be tied to
# its exact source.

name: build-image

on:
  push:
    branches: [master] # publish runs only from master; other branches
                       # only build via pull_request (never push)
  pull_request:
  workflow_dispatch:

# A newer run for the same ref cancels older still-running ones, so a
# burst of pushes does not stack up runs or let a slow OLDER run finish
# last and push stale code over ghcr.io/...:latest.  Grouping by ref
# keeps master pushes, PRs, and manual runs on different branches from
# cancelling each other.
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — full history + tags, so `git describe --tags`
      # below can name the newest release tag and count commits past it
      # (the default shallow checkout would see no tags at all and fall
      # back to a bare sha).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Tests run in a uv-managed environment from the same uv.lock the
      # image uses.  The dev dependency-group (pytest + httpx for
      # TestClient) is installed by plain `uv sync`; --no-sync keeps uv
      # run from re-syncing (a no-op here, but explicit).
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.7"
      - name: Run tests
        run: |
          uv sync --frozen
          uv run --no-sync pytest -q

      # Compute the version/commit identifiers for the image build:
      # GIT_VERSION is `git describe --tags --dirty --always` ("0.2.0"
      # on a release tag, "0.2.0-3-g943694e" past it, "-dirty" appended
      # when the tree has uncommitted changes; --always falls back to
      # the short sha in a fresh checkout with no tags yet).  GIT_HASH
      # is the full commit sha.  Both ride into the image as build args
      # (see the Dockerfile) and out to the admin ☰ menu via /api/banner.
      - name: Compute version identifiers
        id: meta
        run: |
          echo "version=$(git describe --tags --dirty --always)" >> "$GITHUB_OUTPUT"
          echo "hash=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      # Dependency audit: check every package pinned in uv.lock against
      # the PyPA advisory database (CVE/GHSA).  Audits the runtime
      # graph exactly as the Docker image installs it (--no-dev, from
      # the lockfile — no resolution, no upgrades; uv.lock itself is
      # never modified, updates remain a deliberate `uv lock --upgrade`
      # + review).  Non-blocking for now (continue-on-error) so an
      # advisory can be triaged without failing every build; flip to
      # strict by removing that flag once the baseline is known.  A
      # finding is also annotated in the summary with its aliases and
      # the fixed versions, so the fix is one `uv lock --upgrade` away.
      - name: Audit locked dependencies (pip-audit)
        continue-on-error: true
        run: |
          uv export --frozen --no-dev --format requirements-txt --no-hashes -o /tmp/requirements.txt
          # --no-deps: the requirements file is already the fully
          # resolved lock graph; asking pip-audit to re-resolve it (its
          # default) would query PyPI for each package and could pick
          # versions that differ from the lockfile.
          uv run --no-sync --with pip-audit python -m pip_audit \
            -r /tmp/requirements.txt --no-deps --progress-spinner off \
            --format markdown --output /tmp/audit.md || true
          if [ -s /tmp/audit.md ]; then
            cat /tmp/audit.md >> "$GITHUB_STEP_SUMMARY"
          fi
          # Exit non-zero on findings for the step marker, but do not
          # fail the job (continue-on-error above tolerates it).
          uv run --no-sync --with pip-audit python -m pip_audit \
            -r /tmp/requirements.txt --no-deps --progress-spinner off

      - uses: docker/setup-buildx-action@v4

      - name: Build image (session-timer:latest, amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: session-timer:latest
          build-args: |
            GIT_VERSION=${{ steps.meta.outputs.version }}
            GIT_HASH=${{ steps.meta.outputs.hash }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Smoke test: the container must serve a static asset, mirroring
      # the image HEALTHCHECK (GETs never create a session).
      - name: Smoke test the image
        run: |
          docker run -d --rm --name smoke -p 127.0.0.1:8000:8000 session-timer:latest
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/healthz; then
              echo "smoke test ok"
              docker rm -f smoke >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "container did not serve requests:" >&2
          docker logs smoke >&2 || true
          exit 1

  publish:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — same reason as the test job's checkout: tags
      # must be visible for `git describe --tags` below.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Same version identifiers as the test job's build (a fresh
      # checkout of the same commit produces the same values).
      - name: Compute version identifiers
        id: meta
        run: |
          echo "version=$(git describe --tags --dirty --always)" >> "$GITHUB_OUTPUT"
          echo "hash=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      # QEMU + binfmt lets the amd64 runner build the arm64 half of the
      # image (Pi 5 / 64-bit Raspberry Pi OS).  The first push creates
      # the package (private by default — flip it to public in the
      # package settings if it should be pullable anonymously).
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One manifest, two architectures: docker pulls pick the right
      # one automatically (e.g. on a Pi 5 or an x86 server).
      - name: Build and push (ghcr.io/rkdarst/session-timer:latest, amd64+arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/rkdarst/session-timer:latest
          build-args: |
            GIT_VERSION=${{ steps.meta.outputs.version }}
            GIT_HASH=${{ steps.meta.outputs.hash }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
