<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/static/favicon.png">
<title>Session timer</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="display">
<div id="display-controls">
  <button id="font-smaller" title="Smaller countdown text">−</button>
  <button id="fullscreen" title="Toggle fullscreen (Esc also exits)">⛶</button>
  <button id="font-bigger" title="Larger countdown text">+</button>
  <button id="dim-darker" title="Dim the screen (synced to all panels)">☾</button>
  <button id="dim-lighter" title="Brighten the screen (synced to all panels)">☀</button>
</div>
<div id="timer"></div>
<div id="next-wrap" hidden>
  <div id="next-bar"></div>
  <div id="next-text"></div>
</div>
<div id="bar-wrap"><div id="bar"></div></div>
<div id="dim-overlay"></div>
<script src="/static/common.js"></script>
<script src="/static/display.js"></script>
</body>
</html>
